name: Sync case study list

# Rebuilds the case-study list in README.md (the REPOS:START:lorisca-analytics
# block) from the Work hub's data/lanes.json. Runs every hour and on demand.
# Writes a commit only when the list changed.
#
# scripts/sync-profile.mjs is a copy of the one in lorisca-analytics/.github,
# where its tests live. Change it there first, then copy it here.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/sync-profile.yml"]

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-profile.mjs --target profile --write
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "List already up to date."
            exit 0
          fi
          git config user.name "Lorisca Tuuk"
          git config user.email "loriscatuuk@gmail.com"
          git add README.md
          git commit -m "Profile: sync the case study list with the Work hub"
          git push
